pre-commit:
  commands:
    lex-mirror:
      priority: 1
      run: |
        pixi run -e lint bash -c '
          set -euo pipefail
          git diff --cached --name-only -z --diff-filter=d | while IFS= read -r -d "" f; do
            case "$f" in
              *.lex) ;;
              *) continue ;;
            esac
            [ -f "$f" ] || continue
            md="${f%.lex}.md"
            if [ -f "$md" ]; then
              bash tools/lex-convert-doc.sh "$f"
              git add "$md"
            fi
          done
        '
