name: advance-major


on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Force-move the v<MAJOR> branch (stable releases only)
        env:
          REF: ${{ github.ref }}
        run: |
          TAG="${REF#refs/tags/}"
          case "$TAG" in
            *-*)
              echo "prerelease tag $TAG: not advancing the major branch"
              exit 0
              ;;
          esac
          BRANCH="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -f "$BRANCH" "$TAG"
          git push origin "$BRANCH" --force-with-lease
