name: wf-release


on:
  workflow_call:
    inputs:
      version:
        description: >-
          The release version: a bare semver (1.2.3, 1.2.3-rc.1) or a bump
          word (major|minor|patch).
        type: string
        required: true
      unsigned:
        description: >-
          Break-glass: flip a signing plan to the unsigned path (recorded;
          refused when the plan has no sign stage to skip).
        type: boolean
        required: false
        default: false
      endpoints:
        description: >-
          Per-invocation endpoint selector (ADR-0070, #1046): a comma- or
          space-separated endpoint-name list, forwarded VERBATIM to the
          publish stage — the one consumer; the publish verb validates it
          and fires only the named endpoints. Empty/omitted: the full
          post-guard set fires (unchanged behavior).
        type: string
        required: false
    secrets:
      RELEASE_TOKEN:
        required: false
      CARGO_REGISTRY_TOKEN:
        required: false
      PYPI_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      HOMEBREW_TAP_TOKEN:
        required: false
      VSCE_PAT:
        required: false
      OVSX_PAT:
        required: false
      DOWNSTREAM_DISPATCH_TOKEN:
        required: false
      ARTIFACT_CHANNEL_KEY_ID:
        required: false
      ARTIFACT_CHANNEL_SECRET_KEY:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      ASC_API_KEY_BASE64:
        required: false
      ASC_API_KEY_ID:
        required: false
      ASC_API_ISSUER_ID:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: write

jobs:
  prepare:
    uses: arthur-debert/shipit/.github/workflows/wf-prepare.yml@v1
    with:
      version: ${{ inputs.version }}
      unsigned: ${{ inputs.unsigned }}
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      DOWNSTREAM_DISPATCH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
      ARTIFACT_CHANNEL_KEY_ID: ${{ secrets.ARTIFACT_CHANNEL_KEY_ID }}
      ARTIFACT_CHANNEL_SECRET_KEY: ${{ secrets.ARTIFACT_CHANNEL_SECRET_KEY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  build:
    needs: prepare
    uses: arthur-debert/shipit/.github/workflows/wf-build.yml@v1
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      matrix: ${{ needs.prepare.outputs.matrix }}
      stages: ${{ needs.prepare.outputs.stages }}

  sign:
    needs: [prepare, build]
    if: needs.prepare.outputs.sign-matrix != '[]'
    uses: arthur-debert/shipit/.github/workflows/wf-sign-mac.yml@v1
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      sign-matrix: ${{ needs.prepare.outputs.sign-matrix }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    needs: [prepare, build, sign]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    uses: arthur-debert/shipit/.github/workflows/wf-publish.yml@v1
    with:
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      build-result: ${{ needs.build.result }}
      bundle-result: ${{ needs.build.result }}
      sign-result: ${{ needs.sign.result }}
      matrix: ${{ needs.prepare.outputs.matrix }}
      unsigned-matrix: ${{ needs.prepare.outputs.unsigned-matrix }}
      stages: ${{ needs.prepare.outputs.stages }}
      endpoints: ${{ inputs.endpoints }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      DOWNSTREAM_DISPATCH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
      ARTIFACT_CHANNEL_KEY_ID: ${{ secrets.ARTIFACT_CHANNEL_KEY_ID }}
      ARTIFACT_CHANNEL_SECRET_KEY: ${{ secrets.ARTIFACT_CHANNEL_SECRET_KEY }}
