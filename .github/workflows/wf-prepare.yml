name: wf-prepare


on:
  workflow_call:
    inputs:
      version:
        description: >-
          The release version: a bare semver (1.2.3, 1.2.3-rc.1) or a bump
          word (major|minor|patch).
        type: string
        required: true
      unsigned:
        description: >-
          Break-glass: flip a signing plan to the unsigned path (recorded;
          refused when the plan has no sign stage to skip).
        type: boolean
        required: false
        default: false
    outputs:
      version:
        description: The resolved concrete semver.
        value: ${{ jobs.prepare.outputs.version }}
      tag:
        description: The release tag (v<version>) prepare pushed.
        value: ${{ jobs.prepare.outputs.tag }}
      release-sha:
        description: The commit the tag points at.
        value: ${{ jobs.prepare.outputs.release-sha }}
      prerelease:
        description: "'true' when the version carries a prerelease part."
        value: ${{ jobs.prepare.outputs.prerelease }}
      matrix:
        description: The plan's OS×arch matrix (GitHub matrix.include shape).
        value: ${{ jobs.prepare.outputs.matrix }}
      sign-matrix:
        description: >-
          The matrix entries whose plan sign flag is true — the wf-sign-mac
          fan. A projection of the plan's per-entry decision, never a
          re-derivation.
        value: ${{ jobs.prepare.outputs.sign-matrix }}
      unsigned-matrix:
        description: >-
          The matrix entries whose plan sign flag is false AND whose artifact
          declares a bundle — the trees that never traverse wf-sign-mac yet
          carry a bundle for wf-publish to assert (ADR-0040). A build-only
          artifact (no composition) has no tree to guard, so it is excluded:
          the assert job must not fan over an entry with no `bundle-*`
          artifact to download.
        value: ${{ jobs.prepare.outputs.unsigned-matrix }}
      stages:
        description: The plan's live stage subset, pipeline order.
        value: ${{ jobs.prepare.outputs.stages }}
      endpoints:
        description: The plan's post-RC-guard endpoint set.
        value: ${{ jobs.prepare.outputs.endpoints }}
      secrets:
        description: >-
          The plan-scoped required GitHub secret names (the conjunction
          only; the plan's either-satisfies notary requirement rides the
          plan JSON's `secret_alternatives`, #746).
        value: ${{ jobs.prepare.outputs.secrets }}

    secrets:
      RELEASE_TOKEN:
        description: >-
          PAT for prepare's branch+tag push through the ruleset (and so the
          pushed tag still triggers workflows — a GITHUB_TOKEN push would
          not).
        required: false
      CARGO_REGISTRY_TOKEN:
        required: false
      PYPI_TOKEN:
        required: false
      NPM_TOKEN:
        required: false
      HOMEBREW_TAP_TOKEN:
        required: false
      VSCE_PAT:
        required: false
      OVSX_PAT:
        required: false
      DOWNSTREAM_DISPATCH_TOKEN:
        required: false
      ARTIFACT_CHANNEL_KEY_ID:
        required: false
      ARTIFACT_CHANNEL_SECRET_KEY:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      ASC_API_KEY_BASE64:
        required: false
      ASC_API_KEY_ID:
        required: false
      ASC_API_ISSUER_ID:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      release-sha: ${{ steps.prepare.outputs.release-sha }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
      matrix: ${{ steps.plan.outputs.matrix }}
      sign-matrix: ${{ steps.plan.outputs.sign-matrix }}
      unsigned-matrix: ${{ steps.plan.outputs.unsigned-matrix }}
      stages: ${{ steps.plan.outputs.stages }}
      endpoints: ${{ steps.plan.outputs.endpoints }}
      secrets: ${{ steps.plan.outputs.secrets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.71.0
          locked: true
      - name: Preflight — emit the release plan
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          UNSIGNED: ${{ inputs.unsigned }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          DOWNSTREAM_DISPATCH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
          ARTIFACT_CHANNEL_KEY_ID: ${{ secrets.ARTIFACT_CHANNEL_KEY_ID }}
          ARTIFACT_CHANNEL_SECRET_KEY: ${{ secrets.ARTIFACT_CHANNEL_SECRET_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # pipefail: the default step shell is `bash -e` WITHOUT pipefail, so
          # a failed producer in `preflight | jq` would be masked by jq's 0 on
          # empty input — the step would write blank outputs and let `prepare`
          # push a release the plan never sanctioned. The barrier depends on
          # the whole pipeline failing.
          set -euo pipefail
          flags=()
          if [ "$UNSIGNED" = "true" ]; then flags+=(--unsigned); fi
          plan="$(pixi run --locked ./bin/shipit release preflight "$VERSION" --json "${flags[@]}" | jq -c .)"
          {
            printf 'matrix=%s\n' "$(jq -c '.matrix' <<<"$plan")"
            printf 'sign-matrix=%s\n' "$(jq -c '[.matrix[] | select(.sign)]' <<<"$plan")"
            printf 'unsigned-matrix=%s\n' "$(jq -c '[.matrix[] | select((.sign | not) and .bundle)]' <<<"$plan")"
            printf 'stages=%s\n' "$(jq -c '.stages' <<<"$plan")"
            printf 'endpoints=%s\n' "$(jq -c '.endpoints' <<<"$plan")"
            printf 'secrets=%s\n' "$(jq -c '.secrets' <<<"$plan")"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare — write the release history
        id: prepare
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # pipefail (same reason as the plan step): a failed `prepare` must
          # not be masked by jq's 0 on empty input.
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          prepared="$(pixi run --locked ./bin/shipit release prepare "$VERSION" --json | jq -c .)"
          {
            printf 'version=%s\n' "$(jq -r '.version' <<<"$prepared")"
            printf 'tag=%s\n' "$(jq -r '.tag' <<<"$prepared")"
            printf 'release-sha=%s\n' "$(jq -r '.release_sha' <<<"$prepared")"
            printf 'prerelease=%s\n' "$(jq -r '.prerelease' <<<"$prepared")"
          } >> "$GITHUB_OUTPUT"
      - name: Ship the release notes to wf-publish
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: error
