
[workspace]
name = "shipit"
description = "Portfolio standardization tooling — gh-setup, install, lint — on pixi."
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "linux-aarch64"]

[dependencies]
# >>> shipit-managed launcher deps (do not edit; regenerate via `shipit install`) >>>
uv = "0.11.*"
# <<< shipit-managed launcher deps <<<
# >>> shipit-managed python release deps (do not edit; regenerate via `shipit install`) >>>
twine = "6.2.*"
# <<< shipit-managed python release deps <<<
python = "3.13.*"

ruff = "0.15.*"
shellcheck = "0.10.*"
go-shfmt = "3.*"               # conda-forge name for the `shfmt` binary
yamllint = "1.38.*"
prettier = "3.8.*"
markdownlint-cli = "0.49.*"
actionlint = "1.7.*"
lefthook = "2.1.*"

[pypi-dependencies]
shipit = { path = ".", editable = true }

[activation.env]
CARGO_TARGET_DIR = "$PIXI_PROJECT_ROOT/target"
SCCACHE_BASEDIRS = "$PIXI_PROJECT_ROOT"
CARGO_INCREMENTAL = "0"

[tasks]
# >>> shipit-managed tasks (do not edit; regenerate via `shipit install`) >>>
changelog = "./bin/shipit changelog"
logs = "./bin/shipit logs"
# <<< shipit-managed tasks <<<

[dependencies.pytest]
version = ">=8"

[feature.test.dependencies]
rust = "1.96.*"
act = "0.2.*"
rattler-build = "0.69.*"
zstandard = "0.25.*"

[feature.test.tasks]
test = "./bin/shipit test"

[feature.lint.dependencies]
# >>> shipit-managed lint deps (do not edit; regenerate via `shipit install`) >>>
ruff = "0.15.*"
shellcheck = "0.10.*"
go-shfmt = "3.*"
yamllint = "1.38.*"
prettier = "3.8.*"
markdownlint-cli = "0.49.*"
actionlint = "1.7.*"
lefthook = "2.1.*"
# <<< shipit-managed lint deps <<<

[feature.lint.tasks]
# >>> shipit-managed lint task (do not edit; regenerate via `shipit install`) >>>
lint = "./bin/shipit lint"
# <<< shipit-managed lint task <<<
install-hooks = "lefthook install"
regen-roles = "bash tools/regen-roles.sh"

# >>> shipit-managed lexd feature (do not edit; regenerate via `shipit install`) >>>
[feature.shipit-lexd]
channels = ["https://storage.googleapis.com/shipit-artifacts-public/lex-fmt/lex"]
# lexd is a dependency; do not reintroduce runtime `provision lexd`.
[feature.shipit-lexd.target.osx-arm64.dependencies]
lexd = "==0.19.10"
[feature.shipit-lexd.target.linux-64.dependencies]
lexd = "==0.19.10"
[feature.shipit-lexd.target.linux-aarch64.dependencies]
lexd = "==0.19.10"
# <<< shipit-managed lexd feature <<<

[feature.review.tasks]
verify-funnel = "python -m shipit.review.funnel_verify"

[feature.dogfood.pypi-dependencies]
shipit = { path = ".", editable = true }

[feature.dogfood.tasks]
verify-spawn = "python -m shipit.spawn.dogfood"

[environments]
lint = ["lint", "shipit-lexd"]
test = ["test", "shipit-lexd"]
review = ["review"]
dogfood = ["dogfood"]
