[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shipit"
version = "1.7.0"
description = "Portfolio standardization tooling — provisioning, gh-setup, lint, PR flow, release — on pixi."
requires-python = ">=3.13"
dependencies = [
    "click>=8,<9",
    "PyYAML>=6",
    "platformdirs>=4",
    "duckdb>=1",
    "structlog>=25",
    "jc>=1.25",
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
shipit = "shipit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/shipit"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
".claude/agents" = "shipit/data/agents"
".agents/agents" = "shipit/data/agy-agents"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "real_session_store_home: read the real ~ as the session store default (ADR-0073)",
]
